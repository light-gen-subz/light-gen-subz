[package]
name = "light-gen-subz"
version = "1.0.0"
description = "Video/audio to subtitle generator — local speech-to-text"
authors = ["Sikander RAVATE <r.sik@hotmail.fr>"]
license = "MIT"
repository = "https://github.com/light-gen-subz/light-gen-subz"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "light_gen_subz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
whisper-rs = "0.16"
sha2 = "0.11"
reqwest = { version = "0.13", features = ["stream", "blocking", "multipart", "json", "query", "form"] }
futures-util = "0.3"
hound = "3"
dirs = "7"
ort = "=2.0.0-rc.15"
tokenizers = "0.23"
tempfile = "3"
zeroize = "1"

# v1 feature (default): same API as keyring 3, native stores per platform (Secret Service on
# Linux, Keychain on macOS).
keyring = "4"


# Metal: without it whisper.cpp runs on the CPU only, even on Apple Silicon.
[target.'cfg(target_os = "macos")'.dependencies.whisper-rs]
version = "0.16"
features = ["metal"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
